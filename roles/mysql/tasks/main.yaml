- name : mysql pasword
  debug : 
    msg : "{{ lookup('amazon.aws.aws_ssm', 'roboshop-dev-mysql_root_password', decrypt=False , region='us-east-1' ) }}"

- name : printing password
  debug :
    msg : "{{ password }}"

- name : installing mysql-server
  package :
    name : mysql-server 
    state : present

- name : install boto3 and  botocore
  pip :
    name : 
    - boto3
    - botocore
    executable : pip3.9

- name : enable and running
  service :
    name : mysqld
    state : started
    enabled : yes
- name : seting the root password
  command : mysql_secure_installation --set-root-pass "{{password}}"
